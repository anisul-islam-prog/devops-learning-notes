# manifests/12-resource-quota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bmi-app-quota
  namespace: bmi-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "5"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bmi-app-limits
  namespace: bmi-app
spec:
  limits:
    - default:
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container