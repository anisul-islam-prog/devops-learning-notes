# manifests/07-services.yaml
# Database Service - ClusterIP (Internal only)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: bmi-app
  labels:
    app: postgres
    tier: database
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  # Headless service for StatefulSet
  clusterIP: None
---
# Backend Service - ClusterIP (Internal only)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bmi-app
  labels:
    app: backend
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  sessionAffinity: None
---
# Frontend Service - NodePort (External access)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: bmi-app
  labels:
    app: frontend
    tier: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080  # Accessible on any node IP:30080
      name: http