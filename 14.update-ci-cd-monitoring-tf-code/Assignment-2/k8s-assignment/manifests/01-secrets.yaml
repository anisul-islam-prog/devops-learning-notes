# manifests/01-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: bmi-app
type: Opaque
stringData:
  # Base64 encoding happens automatically
  DB_USER: "bmi_user"
  DB_PASSWORD: "SecurePass123!"  # CHANGE THIS IN PRODUCTION!
  DB_NAME: "bmi_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: bmi-app
type: Opaque
stringData:
  SESSION_SECRET: "your-256-bit-secret-key-change-me"