apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: three-tier
data:
  # Backend configuration
  BACKEND_PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # Frontend configuration
  FRONTEND_PORT: "80"
  REACT_APP_API_URL: "http://backend-service:3000"  # Internal DNS resolution
  
  # Database configuration
  DB_HOST: "database-service"
  DB_PORT: "5432"